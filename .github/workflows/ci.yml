name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-build:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        working-directory: vpn-core
      - run: cargo clippy -- -D warnings
        working-directory: vpn-core

  go-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bot, nup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
        working-directory: ${{ matrix.service }}
      - run: go vet ./...
        working-directory: ${{ matrix.service }}

  rust-test:
    needs: rust-build
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: vpn-core

  go-test:
    needs: go-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bot, nup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...
        working-directory: ${{ matrix.service }}

  build-and-push:
    needs: [rust-build, go-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./vpn-core
          push: true
          tags: ghcr.io/${{ github.repository }}/vpn-core:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: true
          tags: ghcr.io/${{ github.repository }}/bot:${{ github.sha }}

  deploy-master:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.MASTER_SSH_USER }}@${{ secrets.MASTER_SSH_HOST }}" \
            "cd /opt/vpn && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' .env && podman-compose pull vpn-core && podman-compose up -d vpn-core"
      - name: Smoke test
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.MASTER_SSH_USER }}@${{ secrets.MASTER_SSH_HOST }}" \
            "curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8443/health" | grep -q 200

  deploy-bot:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.BOT_SSH_USER }}@${{ secrets.BOT_SSH_HOST }}" \
            "cd /opt/bot && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' .env && podman-compose pull bot && podman-compose up -d bot"
      - name: Проверка, что контейнер bot запустился и не упал сразу
        run: |
          sleep 5
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.BOT_SSH_USER }}@${{ secrets.BOT_SSH_HOST }}" \
            "podman inspect bot --format '{{.State.Status}}'" | grep -q running
