name: Release
on:
  push:
    tags: ["v*"]

jobs:
  nup-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o nup-linux-amd64 .
        working-directory: nup
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o nup-linux-arm64 .
        working-directory: nup
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nup/nup-linux-amd64
            nup/nup-linux-arm64
